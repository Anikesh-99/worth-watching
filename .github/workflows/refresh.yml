name: Refresh upcoming + redeploy

# Keeps the demo's "Coming up" section current: re-runs the static build daily
# (which re-fetches live fixtures), and pushes the refreshed bundle — which
# triggers the Pages deploy workflow.

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (refresh deps only)
        run: pip install -q pandas numpy lightgbm requests pyyaml
      - name: Refresh live upcoming fixtures
        run: python scripts/refresh_upcoming.py
      - name: Commit if changed
        run: |
          git config user.name "worth-watching-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_static/data/upcoming.json
          git diff --cached --quiet || git commit -m "chore: scheduled refresh of upcoming fixtures"
          git push
