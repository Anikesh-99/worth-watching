name: Refresh upcoming + redeploy

# Keeps the demo's "Coming up" section current: re-runs the static build daily
# (which re-fetches live fixtures), and pushes the refreshed bundle — which
# triggers the Pages deploy workflow.

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (build-static deps)
        run: pip install -q pandas numpy lightgbm requests pyyaml
      - name: Rebuild static bundle (fresh upcoming + latest committed data)
        run: python scripts/build_static.py
      - name: Commit if changed
        run: |
          git config user.name "worth-watching-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_static/data
          git diff --cached --quiet || git commit -m "chore: scheduled refresh (upcoming + demo bundle)"
          git push
