# F1 vertical configuration.
# The pipeline reads this file rather than hard-coding a sport, which is what
# lets NBA/soccer be added as sibling configs instead of code rewrites.

vertical: f1

cache_dir: data/f1cache

# Seasons pulled into the tidy dataset. Temporal evaluation splits on these:
# train on the earlier seasons, test on the latest (see src/core/evaluation.py).
seasons:
  train: [2021, 2022, 2023]
  test: [2024]

# Personal taste inputs for the personalization layer (your team/drivers).
# Edit these to yours — they drive the spoiler-free "why watch" reasons.
followed_entities:
  - VER   # Verstappen
  - NOR   # Norris
  - LEC   # Leclerc
  - HAM   # Hamilton
