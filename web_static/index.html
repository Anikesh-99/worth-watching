<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Worth Watching?</title>
<style>
  :root { --bg:#0a0b0e; --card:#141821; --line:#232833; --ink:#f4f5f7; --muted:#9aa1ad;
    --accent:#e11d48; --match:#34d399; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--ink); text-decoration:none; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:18px 40px; position:sticky; top:0;
    background:linear-gradient(180deg,rgba(10,11,14,.96),rgba(10,11,14,.0)); z-index:20; }
  .brand { font-size:16px; font-weight:900; letter-spacing:.14em; color:var(--accent); }
  .navlinks { display:flex; gap:20px; font-size:13px; color:#d1d5db; }
  .navlinks span { cursor:pointer; }
  .navlinks .on { color:#fff; font-weight:600; }
  .avatar { width:28px; height:28px; border-radius:5px; background:linear-gradient(135deg,#e11d48,#7c3aed); }

  .hero { position:relative; min-height:460px; display:flex; align-items:flex-end; overflow:hidden;
    padding:0 40px 54px; margin-top:-72px; }
  .hero .scrim { position:absolute; inset:0; z-index:0; }
  .hero .inner { position:relative; z-index:1; max-width:640px; }
  .eyebrow { font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#fff;
    padding:3px 8px; border-radius:4px; display:inline-block; }
  .hero h1 { margin:14px 0 12px; font-size:46px; line-height:1.02; letter-spacing:-.02em; font-weight:850;
    text-shadow:0 2px 20px rgba(0,0,0,.6); }
  .hmeta { display:flex; align-items:center; gap:14px; margin-bottom:12px; font-size:14px; flex-wrap:wrap; }
  .match { color:var(--match); font-weight:700; }
  .hreason { font-size:15px; color:#e5e7eb; margin:0 0 20px; max-width:540px; }
  .btns { display:flex; gap:12px; }
  .btn { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; padding:11px 22px; border-radius:6px; cursor:pointer; }
  .btn-p { background:#fff; color:#0a0b0e; } .btn-s { background:rgba(109,115,128,.5); color:#fff; font-weight:600; }

  .rows { padding:0 40px 60px; margin-top:-30px; position:relative; z-index:2; }
  .shelf { margin-bottom:30px; }
  .shelf h2 { font-size:19px; font-weight:700; margin:0 0 12px; }
  .shelf .sub { font-size:13px; font-weight:500; color:var(--muted); }
  .row { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; scrollbar-width:thin; }
  .row::-webkit-scrollbar { height:8px; } .row::-webkit-scrollbar-thumb { background:#232833; border-radius:8px; }
  .tile { position:relative; border-radius:6px; overflow:hidden; flex:0 0 auto; box-shadow:0 6px 16px rgba(0,0,0,.5); }
  .tile img.cover { width:100%; height:100%; object-fit:cover; display:block; }
  .lbl { position:absolute; top:8px; left:8px; font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#fff; padding:2px 6px; border-radius:4px; }
  .tname { position:absolute; left:8px; right:8px; bottom:7px; font-weight:800; font-size:13px; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .cap { font-size:11px; color:#b6bcc7; margin-top:6px; line-height:1.35; }
  .crest { width:42px; height:42px; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)); }
  .foot { color:var(--muted); font-size:12px; text-align:center; padding:0 40px 40px; }
  .foot a { color:#60a5fa; }
  @media (max-width:640px){ .nav,.hero,.rows,.foot{ padding-left:16px; padding-right:16px; } .hero h1{ font-size:32px; } }
</style>
</head>
<body>
<div class="nav">
  <div style="display:flex; align-items:center; gap:30px;">
    <span class="brand">WORTH&nbsp;WATCHING</span>
    <div class="navlinks"><span class="on">Home</span><span>Sports</span><span>Anime</span><span>Books</span><span>Music</span></div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span style="font-size:11px; color:#93c5fd; border:1px solid rgba(96,165,250,.3); background:rgba(96,165,250,.12); padding:3px 9px; border-radius:999px;">spoiler-free</span>
    <div class="avatar"></div>
  </div>
</div>

<div class="hero" id="hero"></div>
<div class="rows" id="rows"><p style="color:var(--muted); padding:40px 0;">Loading…</p></div>
<p class="foot">Ranked by predicted excitement × taste · spoiler-free reasons only. Sports/anime/books cold-start; music reflects the author's Spotify taste. <a href="https://github.com/Anikesh-99/worth-watching">Source ›</a></p>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPORT = { f1:{c:'#e10600',n:'F1'}, nba:{c:'#c8102e',n:'NBA'}, soccer:{c:'#16a34a',n:'SOCCER'} };
const MEDIA = { anime:{c:'#7c3aed',n:'ANIME',w:118,h:172}, book:{c:'#0d9488',n:'BOOK',w:120,h:180}, music:{c:'#db2777',n:'MUSIC',w:150,h:150} };
const GRAD = ['linear-gradient(150deg,#1b3a5c,#6CABDD)','linear-gradient(150deg,#3b0d24,#db2777)','linear-gradient(150deg,#1a1145,#7c3aed)','linear-gradient(150deg,#0b2a3a,#0ea5e9)','linear-gradient(150deg,#3a2408,#f59e0b)','linear-gradient(150deg,#08321f,#10b981)'];
const grad = id => GRAD[Math.abs([...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0))%GRAD.length];
const pct = it => Math.min(99, Math.round((it.score||0)*100));

function reasonLine(it){ return it.reasons && it.reasons.length ? esc(it.reasons.join(' · ')) : 'ranked on excitement'; }

function sportTile(it){
  const sp = SPORT[it.sport] || {c:'#6b7280', n:(it.sport||'').toUpperCase()};
  const crest = u => u ? `<img class="crest" src="${esc(u)}" onerror="this.remove()">` : '';
  const inner = (it.home_logo||it.away_logo)
    ? `<div style="display:flex;align-items:center;justify-content:center;gap:14px;height:100%;background:linear-gradient(160deg,#12151c,#0a0b0e);">${crest(it.away_logo)}<span style="color:#4b5563;font-weight:800;">v</span>${crest(it.home_logo)}</div>`
    : `<div style="display:flex;align-items:flex-end;height:100%;padding:10px;background:${grad(it.item_id)};"><span class="tname" style="position:static;">${esc(it.label)}</span></div>`;
  return `<div><div class="tile" style="width:200px;height:118px;">${inner}<span class="lbl" style="background:${sp.c};">${sp.n}</span></div>
    <div class="cap"><span class="match">${pct(it)}% match</span> · ${reasonLine(it)}</div></div>`;
}

function mediaTile(it){
  const m = MEDIA[it.sport] || {c:'#6b7280',n:'',w:130,h:180};
  const bg = grad(it.item_id);
  const cover = it.image
    ? `<img class="cover" src="${esc(it.image)}" loading="lazy" onerror="this.remove()">`
    : `<span class="tname">${esc(it.label)}</span>`;
  return `<div><div class="tile" style="width:${m.w}px;height:${m.h}px;background:${bg};">${cover}<span class="lbl" style="background:${m.c};">${m.n}</span></div>
    <div class="cap"><span class="match">${esc(it.tier||'')}</span> · ${esc(it.date||'')}</div></div>`;
}

function shelf(title, sub, items, tiler){
  if(!items || !items.length) return '';
  return `<div class="shelf"><h2>${esc(title)} ${sub?`<span class="sub">· ${esc(sub)}</span>`:''}</h2>
    <div class="row">${items.map(tiler).join('')}</div></div>`;
}

function billboard(it){
  if(!it) return '';
  const sp = SPORT[it.sport]||{c:'#6b7280',n:(it.sport||'').toUpperCase()};
  const bg = (it.home_logo||it.away_logo) ? 'linear-gradient(120deg,#1b3a5c,#6CABDD 60%,#0a0b0e)' : grad(it.item_id);
  $('#hero').innerHTML =
    `<div class="scrim" style="background:linear-gradient(90deg,rgba(10,11,14,.97) 0%,rgba(10,11,14,.7) 45%,rgba(10,11,14,.15) 100%),${bg};"></div>
     <div class="inner">
       <span class="eyebrow" style="background:${sp.c};">Coming up · ${sp.n}</span>
       <h1>${esc(it.label)}</h1>
       <div class="hmeta"><span class="match">${pct(it)}% match</span><span style="color:#d1d5db;">${esc(it.tier||'')}</span><span style="color:#9aa1ad;">${esc(it.date||'')}</span></div>
       <p class="hreason">${reasonLine(it)}</p>
       <div class="btns"><div class="btn btn-p">▶ Remind me</div><div class="btn btn-s">ⓘ Why this?</div></div>
     </div>`;
}

async function load(){
  const j = async f => { try { return await (await fetch('./data/'+f)).json(); } catch(e){ return []; } };
  const [meta, upcoming, sports, anime, music, book] = await Promise.all(
    ['meta.json','upcoming.json','sports.json','anime.json','music.json','book.json'].map(j));

  const topSports = [...(sports||[])].sort((a,b)=>b.score-a.score).slice(0,18).map((x,i)=>({...x,rank:i+1}));
  billboard((upcoming&&upcoming[0]) || topSports[0]);

  let html = '';
  html += shelf('Coming up', 'ranked by watchability × your taste', (upcoming||[]).slice(0,18), sportTile);
  html += shelf('Sports · must-watch', '', topSports, sportTile);
  html += shelf('New anime for you', 'matches your taste', (anime||[]).slice(0,18), mediaTile);
  html += shelf('New music for you', (meta.media&&meta.media.music&&meta.media.music.ratings? 'from your top artists':''), (music||[]).slice(0,18), mediaTile);
  html += shelf('From your reading taste', '', (book||[]).slice(0,18), mediaTile);
  $('#rows').innerHTML = html || '<p style="color:var(--muted);">No data.</p>';
}
load();
</script>
</body>
</html>
